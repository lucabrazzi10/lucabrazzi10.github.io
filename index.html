<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeylessID.com - For Sale or Lease</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .container {
      max-width: 700px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      animation: fadeIn 2s ease-in-out;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.3em;
      letter-spacing: 2px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
    }
    p {
      font-size: 1.3em;
      margin-bottom: 2em;
      line-height: 1.6em;
      color: #e0e0e0;
    }
    .email-display {
      display: inline-block;
      font-size: 1.1em;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 10px;
      margin-top: 20px;
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #bbb;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>KeylessID.com</h1>

       Perfect for Web3, identity, or passwordless authentication ventures.
    </p>
    <div class="email-display">knowmore@keylessid.com</div>
    <div class="footer">Serious inquiries only. Make your offer today.</div>
  </div>
</body>
</html>
